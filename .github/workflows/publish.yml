# Description:
# Thin caller for the shared datasource publish workflow. On a published release it
# publishes docs for the released tag. On manual dispatch it publishes the plugin.
# All logic lives in grafana/data-sources-ci-workflows.
#
# The release trigger is new with release-please: merging the release PR creates the
# tag and the GitHub release, and the docs publish hangs off that release event.
# The dispatch inputs stay as they were, so the manual dev-only and ops-only
# publish paths this repo relies on are preserved.

name: Plugins - Publish plugin
run-name: Publish ${{ inputs.branch }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish from. Can be used to deploy PRs to dev
        default: main
      environment:
        description: Environment to publish to. Selecting "ops" publishes to dev as well (if not already done); "prod" publishes to all environments.
        required: true
        type: choice
        options:
          - "dev"
          - "ops"
          - "prod"
      scope:
        description: Cloud will publish scoped only to Grafana Cloud, On Prem will publish with Universal scope. Please use Cloud unless emergency fix needed for On Prem customer.
        required: true
        type: choice
        default: "cloud (recommended)"
        options:
          - "cloud (recommended)"
          - "on-prem (for emergencies fix to On Prem customers)"
      docs-only:
        description: Only publish docs, do not publish the plugin
        default: false
        type: boolean

permissions: {}

jobs:
  publish:
    name: Publish
    # Intentionally pinned to @main: data-sources-ci-workflows publishes no
    # versioned tags for datasource-publish.yml yet. Review periodically.
    uses: grafana/data-sources-ci-workflows/.github/workflows/datasource-publish.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    with:
      # On a release event every dispatch input is empty. That is harmless: the
      # shared workflow's docs job reads github.event.release and ignores these,
      # and only its manual job reads them.
      branch: ${{ github.event.inputs.branch }}
      # prod targets all environments by default; ops does not target dev by default
      environment: ${{ github.event.inputs.environment == 'ops' && 'dev,ops' || github.event.inputs.environment }}
      scopes: ${{ github.event.inputs.scope == 'cloud (recommended)' && 'grafana_cloud' || 'universal' }}
      # A string comparison rather than fromJSON: on a release event the input is
      # empty, and fromJSON('') fails the whole expression.
      docs-only: ${{ github.event.inputs.docs-only == 'true' }}
    secrets: inherit
